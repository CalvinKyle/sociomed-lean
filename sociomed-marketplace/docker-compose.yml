version: '3.5'

services:
  # 1. THE BRAIN (Odoo ERP)
  web:
    image: odoo:16.0
    depends_on:
        db:
    ports:
        "8069:8069" # This makes Odoo accessible at your-domain.com:8069
    environment:
        HOST: db
        USER: odoo
        PASSWORD: ${ODOO_PASSWORD}          # Loaded from .env
    volumes:
        odoo-web-data:/var/lib/odoo
        ./odoo_custom_addons:/mnt/extra-addons   # Loads your custom modules

  # 2. THE MEMORY (PostgreSQL Database)
  db:
    image: postgres:14
    environment:
        POSTGRES_DB: ${POSTGRES_DB}              # Loaded from .env
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}     # Loaded from .env
        POSTGRES_USER: ${POSTGRES_USER}
    volumes:
        odoo-db-data:/var/lib/postgresql/data

  # 3. THE MOUTH (Your WhatsApp Bot)
  whatsapp-bot:
    build: ./app
    restart: always
    environment:
        ODOO_URL: http://web:8069  # Bot talks to Odoo internally
        ODOO_DB: db
        ODOO_USER: odd
        ODOO_PASSWORD: ${ODOO_PASSWORD} 
    depends_on:
        web

volumes:
  odoo-web-data:
  odoo-db-data:

version: "3.9"

# Lean SocioMed stack: just the bot + a volume for data.
# No Odoo, no Redis, no Celery, no PostgreSQL.
# Total memory footprint: ~180MB RAM.

services:
  bot:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      # Persist SQLite sessions + quotes between deploys
      - sociomed_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sociomed_data:

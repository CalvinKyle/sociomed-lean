services:
  sociomed-database:
    image: postgres:17-alpine               # Latest stable as of Dec 2025
    container_name: sociomed-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: sociomed_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}     # Loaded from .env
      POSTGRES_DB: sociomed
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d    # Mount entire db/ folder — all .sql files run automatically
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sociomed_user -d sociomed"]
      interval: 10s
      timeout: 5s
      retries: 5

  sociomed-app:
    build: .
    container_name: sociomed-app
    restart: unless-stopped
    depends_on:
      sociomed-database:
        condition: service_healthy          # Waits for DB to be ready
    volumes:
      - ./app:/app                          # Code — hot-reload in dev
      - ./data:/data                        # Input/processed Excel & PDFs
      - ./logs:/logs                        # Logs persistence (optional)
    env_file:
      - .env                                # Loads Gemini key, WhatsApp tokens, etc.
    ports:
      - "5001:5000"                         # Direct mapping
    command: python -u /app/whatsapp_bot.py # Actually runs your bot
    
  redis:
    image: redis:alpine
    container_name: sociomed-redis
    restart: unless-stopped
    ports:
      - "6379:6379"          # Only for testing — you can remove later
    volumes:
      - redis_data:/data     # Saves data even if container restarts

volumes:
  pg_data:
  redis_data: 

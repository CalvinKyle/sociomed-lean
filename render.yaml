services:
  - type: web
    name: sociomed-lean
    env: docker
    region: us-east
    plan: standard

    healthCheckPath: /api/health/liveness
    healthCheckInterval: 30

    autoDeploy: false

    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WHATSAPP_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WEBHOOK_URL
        sync: false
      - key: TWILIO_STATUS_CALLBACK_URL
        sync: false
      - key: SALES_AGENT_PHONE
        sync: false
      - key: SUPPORT_EMAIL
        value: sales@socio-med.com
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ENABLE_OPEN_DOCS
        value: "false"
      - key: API_KEY
        sync: false
      - key: GOOGLE_CREDS_FILE
        value: .secrets/google-service-account.json
      - key: GOOGLE_CREDS_JSON
        sync: false
      - key: SHEET_NAME
        value: sociomed_db
      - key: DATABASE_URL
        fromService:
          name: sociomed-postgres
          type: pgsql
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: sociomed-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: sociomed-redis
          type: redis
          property: port
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: SESSION_TTL
        value: "1800"
      - key: DEFAULT_CURRENCY
        value: UGX

  - type: worker
    name: sociomed-lean-celery-worker
    env: python
    region: us-east
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: WHATSAPP_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WEBHOOK_URL
        sync: false
      - key: TWILIO_STATUS_CALLBACK_URL
        sync: false
      - key: SALES_AGENT_PHONE
        sync: false
      - key: SUPPORT_EMAIL
        value: sales@socio-med.com
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DEFAULT_CURRENCY
        value: UGX
      - key: DATABASE_URL
        fromService:
          name: sociomed-postgres
          type: pgsql
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: sociomed-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: sociomed-redis
          type: redis
          property: port

  - type: worker
    name: sociomed-lean-celery-beat
    env: python
    region: us-east
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app beat --loglevel=info
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: WHATSAPP_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_STATUS_CALLBACK_URL
        sync: false
      - key: SALES_AGENT_PHONE
        sync: false
      - key: DATABASE_URL
        fromService:
          name: sociomed-postgres
          type: pgsql
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: sociomed-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: sociomed-redis
          type: redis
          property: port

  - type: web
    name: sociomed-lean-flower
    env: python
    region: us-east
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app flower --address=0.0.0.0 --port=$PORT --basic-auth=admin:$FLOWER_PASSWORD
    envVars:
      - key: APP_ENV
        value: production
      - key: REDIS_HOST
        fromService:
          name: sociomed-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: sociomed-redis
          type: redis
          property: port
      - key: FLOWER_PASSWORD
        sync: false

  - type: redis
    name: sociomed-redis
    region: us-east
    plan: free

  - type: pgsql
    name: sociomed-postgres
    region: us-east
    plan: free

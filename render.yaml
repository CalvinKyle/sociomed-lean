services:
  - type: web
    name: sociomed-lean
    runtime: docker
    region: virginia
    plan: standard
    branch: august_launch
    autoDeployTrigger: off
    healthCheckPath: /api/health/liveness
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LAUNCH_MODE
        value: "true"
      - key: ENABLE_FEATURED_OFFERS
        value: "false"
      - key: ENABLE_CATEGORY_BROWSE
        value: "false"
      - key: ENABLE_RELATED_PRODUCTS
        value: "false"
      - key: EXPOSE_SUPPLIER_NAMES
        value: "false"
      - key: VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: SALES_AGENT_PHONE
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ENABLE_OPEN_DOCS
        value: "false"
      - key: API_KEY
        sync: false
      - key: GOOGLE_CREDS_JSON
        sync: false
      - key: SHEET_NAME
        value: sociomed_db
      - key: DATABASE_URL
        fromDatabase:
          name: sociomed-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sociomed-redis
          type: keyvalue
          property: connectionString
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: SESSION_TTL
        value: "1800"
      - key: SESSION_VERSION
        value: "2"
      - key: DEFAULT_CURRENCY
        value: UGX
      - key: MAX_AUTO_PFI_LEAD_TIME_DAYS
        value: "0"
      - key: MERCHANT_LEGAL_NAME
        sync: false
      - key: MERCHANT_TRADING_NAME
        sync: false
      - key: MERCHANT_TAGLINE
        sync: false
      - key: MERCHANT_ADDRESS_LINES_JSON
        sync: false
      - key: MERCHANT_PHONE_LINES_JSON
        sync: false
      - key: MERCHANT_EMAIL
        sync: false
      - key: MERCHANT_WEBSITE
        sync: false
      - key: MERCHANT_TAX_ID
        sync: false
      - key: MERCHANT_VAT_WORDING
        sync: false
      - key: MERCHANT_BANK_NAME
        sync: false
      - key: MERCHANT_BANK_ACCOUNT_NAME
        sync: false
      - key: MERCHANT_BANK_ACCOUNT_NUMBER
        sync: false
      - key: MERCHANT_BANK_BRANCH
        sync: false
      - key: MERCHANT_BANK_SWIFT
        sync: false
      - key: PFI_VALIDITY_DAYS
        value: "14"
      - key: PFI_PAYMENT_TERMS
        sync: false
      - key: PFI_DELIVERY_TERMS
        sync: false
      - key: PFI_CONSUMABLES_WARRANTY
        sync: false
      - key: PFI_EQUIPMENT_WARRANTY
        sync: false
      - key: PFI_EQUIPMENT_INSTALLATION
        sync: false
      - key: PFI_TECHNICAL_SUPPORT
        sync: false

  - type: worker
    name: sociomed-lean-celery-worker
    runtime: python
    region: virginia
    plan: starter
    branch: august_launch
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LAUNCH_MODE
        value: "true"
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: SALES_AGENT_PHONE
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DEFAULT_CURRENCY
        value: UGX
      - key: DATABASE_URL
        fromDatabase:
          name: sociomed-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sociomed-redis
          type: keyvalue
          property: connectionString
      - key: MERCHANT_LEGAL_NAME
        sync: false
      - key: MERCHANT_TRADING_NAME
        sync: false
      - key: MERCHANT_ADDRESS_LINES_JSON
        sync: false
      - key: MERCHANT_PHONE_LINES_JSON
        sync: false
      - key: MERCHANT_EMAIL
        sync: false
      - key: MERCHANT_VAT_WORDING
        sync: false
      - key: MERCHANT_BANK_NAME
        sync: false
      - key: MERCHANT_BANK_ACCOUNT_NAME
        sync: false
      - key: MERCHANT_BANK_ACCOUNT_NUMBER
        sync: false
      - key: PFI_VALIDITY_DAYS
        value: "14"
      - key: PFI_PAYMENT_TERMS
        sync: false
      - key: PFI_DELIVERY_TERMS
        sync: false
      - key: PFI_CONSUMABLES_WARRANTY
        sync: false
      - key: PFI_EQUIPMENT_WARRANTY
        sync: false
      - key: PFI_EQUIPMENT_INSTALLATION
        sync: false
      - key: PFI_TECHNICAL_SUPPORT
        sync: false

  - type: keyvalue
    name: sociomed-redis
    region: virginia
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: sociomed-postgres
    region: virginia
    plan: basic-256mb

services:
  - type: web
    name: sociomed-lean
    runtime: docker
    # Paid, always-on instance. The free tier sleeps after 15 minutes idle, so
    # the first WhatsApp message of the day could time out.
    plan: starter
    # `main` is the canonical branch (promoted from codex/twilio-whatsapp-beta;
    # 2026_pivot is archived). Deploys are manual during the pilot so a push
    # can never change what real customers are talking to.
    branch: main
    autoDeployTrigger: "off"
    healthCheckPath: /api/health/liveness

    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RUN_DB_MIGRATIONS
        value: "true"
      - key: SHEETS_AUTO_SYNC_ENABLED
        value: "false"
      - key: SHEETS_AUTO_SYNC_INTERVAL_MINUTES
        value: "60"
      - key: MIGRATION_MAX_ATTEMPTS
        value: "12"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT_SECONDS
        value: "120"
      - key: WHATSAPP_PROVIDER
        value: twilio
      - key: ASYNC_WHATSAPP_PROCESSING
        value: "false"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WEBHOOK_URL
        sync: false
      - key: TWILIO_STATUS_CALLBACK_URL
        sync: false
      - key: SALES_AGENT_PHONE
        sync: false
      - key: SUPPORT_EMAIL
        value: sales@socio-med.com
      - key: ENABLE_OPEN_DOCS
        value: "false"
      - key: API_KEY
        generateValue: true
      - key: GOOGLE_CREDS_JSON
        sync: false
      - key: SHEET_NAME
        value: sociomed_db
      - key: DATABASE_URL
        fromDatabase:
          name: sociomed-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sociomed-redis
          property: connectionString
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: SESSION_TTL
        value: "3600"
      - key: SESSION_VERSION
        value: "2"
      - key: SMALL_RFQ_MAX_ITEMS
        value: "5"
      - key: DEFAULT_CURRENCY
        value: UGX

  - type: keyvalue
    name: sociomed-redis
    # No `plan:` key = Render's default paid size (256 MB). Free Key Value has
    # no persistence, so conversation sessions would vanish on every restart.
    # Verify the resulting plan on the Render dashboard after the first sync.
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: sociomed-postgres
    # No `plan:` key = Render's default paid size. Free Postgres expires 30
    # days after creation and is deleted 14 days later. Verify on the dashboard.

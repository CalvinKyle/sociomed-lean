services:
  - type: web
    name: sociomed-lean
    env: docker
    region: us-east
    plan: standard
    
    healthCheckPath: /api/health
    healthCheckInterval: 30
    
    autoDeploy: false
    
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: GOOGLE_CREDS_FILE
        value: credentials.json
      - key: SHEET_NAME
        value: sociomed_db
      - key: DATABASE_URL
        fromService:
          name: sociomed-postgres
          type: pgsql
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: sociomed-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: sociomed-redis
          type: redis
          property: port
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: SESSION_TTL
        value: "1800"
      - key: DEFAULT_CURRENCY
        value: UGX

  # render.yaml — replace the Celery worker block

  - type: worker
    name: sociomed-lean-celery-worker
    env: python
    region: us-east
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromService:
          name: sociomed-postgres
          type: pgsql
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: sociomed-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: sociomed-redis
          type: redis
          property: port

  # ── Flower Monitoring Dashboard (added)
  - type: web
    name: sociomed-lean-flower
    env: python
    region: us-east
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app flower --address=0.0.0.0 --port=$PORT --basic-auth=admin:$FLOWER_PASSWORD
    envVars:
      - key: REDIS_HOST
        fromService:
          name: sociomed-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: sociomed-redis
          type: redis
          property: port
      - key: FLOWER_PASSWORD
        sync: false   # Set this manually in Render dashboard (strong password)

  - type: redis
    name: sociomed-redis
    region: us-east
    plan: free

  - type: pgsql
    name: sociomed-postgres
    region: us-east
    plan: free   # change to starter when you go live
